<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q2 Project</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .custom-navbar{
            background-color: #359FA0;
        }
        .navbar-nav{
            gap: 50px;
            font-size: 20px;
        }
        .portal-btn {
            width: 110px;
            min-width: 110px;
            flex-shrink: 0;
            white-space: nowrap;
            background-color: #FF8C52;
        }
        #logo{
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        h1{
            text-align: center;
            font-weight: bold;
            color: white;
        }
        h3{
            font-weight: bold;
            color: white;
            background-color: #359FA0;
            padding: 5px;
        }
        #container{
            width: 80%;
            height: auto;
            border-radius: 10px;
            padding: 30px;
            margin-left: 130px;
            display: block;
            background:white;
            box-shadow: white;
        }
        header{
            background-color: #359FA0;
            padding: 10px;
            border-radius: 10px;
        }
        p{
            text-align: center;
            font-size: 20px;
        }
    </style>

    <nav class="navbar navbar-expand-lg navbar-dark custom-navbar">
  <div class="container-fluid">
    <a class="navbar-brand" href=""><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR1fPjyNg5xFEOtT5wBIhcsb3H__yQMgGnnE6Y-yCOr6VzFjiJQctV9dWo&s=10" alt="logo" id="logo" class="rounded-circle" style="height: 70px; width: 70px"></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mynavbar">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mynavbar">
      <ul class="navbar-nav mx-auto">
        <li class="nav-item">
          <a class="nav-link" href="#Home">Home Page</a>
        </li>
         <li class="nav-item">
          <a class="nav-link" href="#Courses">Courses Offer</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#Enroll">Enroll Now</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#Contact">Contact Us</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#About">About the Students</a>
        </li>
      </ul>
      <form class="d-flex align-items-center gap-2 navbar-form">
        <input class="form-control search-input" type="search" placeholder="Search">
        <button class="btn portal-btn" type="button">Search</button>
      </form>
    </div>
  </div>
</nav>
</head>
<br>
<br>

<body>
    <div class="container-fluid" id="container">
        <div class="row vh-100">
            <div class="col">
                <header>
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR1fPjyNg5xFEOtT5wBIhcsb3H__yQMgGnnE6Y-yCOr6VzFjiJQctV9dWo&s=10" alt="logo" id="logo" class="rounded-circle" style="height: 80px; width: 80px;">
                    <h1>Student Enrollment</h1>
                </header>
                <br>

                <p>Start you learning journey with us! Please fill out the form below to register.</p>
                <br>
                <br>
                <div class="fillup">
                    <form action="">
                        <h3>Student Information</h3>
                        <br>
                        
                        <div class="row">
                            <div class="col-4">
                                <span><label for="fname">First Name:</label></span>
                                <br>
                                <input type="name" id="fname" name="fname" class="form-control" placeholder="Eg. Juan" required>
                            </div>

                            <div class="col-4">
                                <span><label for="fname">Middle Name:</label></span>
                                <br>
                               <input type="name" id="mname" name="mname" class="form-control" placeholder="E.g. Rizal"required>
                            </div>

                            <div class="col-4">
                                <span><label for="fname">Last Name:</label></span>
                                <br>
                                <input type="name" id="lname" name="lname" class="form-control" placeholder="E.g. Juan"required>
                            </div>
                        </div>
                        <br>
                        <br>

                        <div class="row">
                            <div class="col-4">
                               <span><label for="dbirth">Date of Birth:</label></span>
                               <br>
                               <input type="date" id="dbirth" class="form-control" name="dbirth" required>
                            </div>

                            <div class="col-4">
                                <span><label for="pbirth">Place of Birth:</label></span>
                                <br>
                                <input type="address" id="pbirth" class="form-control" name="pbirth" placeholder="E.g. Commonwealth Hospital and Medical Center" required>
                            </div>

                            <div class="col-4">
                                <span><label for="nation">Nationality:</label></span>
                                <br>
                                <input type="name" id="nation" class="form-control" name="nation" placeholder="Filipino" required>
                            </div>
                        </div>
                        <br>
                        <br>

                        <div class="row">
                            <div class="col-4">
                               <span><label for="age">Age:</label></span>
                               <br>
                               <input type="number" id="age" class="form-control" name="age" required>
                            </div>

                            <div class="col-4">
                                <span><label for="religion">Religious Affiliation</label></span>
                                <br>
                                <select name="religions" id="religion" class="form-control">
                                    <option value="select" disabled> Select Religious Affiliation</option>
                                    <option value="1">Roman Catholic</option>
                                    <option value="2">Iglesia ni Christo</option>
                                    <option value="3">Born Again Christian</option>
                                    <option value="4">Islam</option>
                                    <option value="5">Buddhist</option>
                                    <option value="6">Protestant</option>
                                    <option value="7">Mormon</option>
                                    <option value="8">Seventh-day Adventist</option>
                                    <option value="9">Other</option>
                                </select>
                            </div>

                            <div class="col-4">
                                <span><label for="gender">Gender:</label></span>
                                <br>
                                <div class="row">
                                  <div class="col-4">
                                     <input type="radio" id="gender1" name="gender">
                                     <label for="gender1" class="radio-text">Male</label>
                                  </div>

                                  <div class="col-4">
                                     <input type="radio" id="gender2" name="gender">
                                     <label for="gender2" class="radio-text">Female</label>
                                  </div>
                            </div>
                        </div>
                        </div>
                        <br>
                        <br>
                        
                        <div class="row">

                            <div class="col-6">
                               <span><label for="address">Current Address(House No./Unit No./Floor, Street/Subdivision):</label></span>
                               <br>
                               <input type="name" id="address" class="form-control" name="address" required>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
